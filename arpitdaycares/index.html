<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACPC Daycare Diagnostic — Arpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@700;800&display=swap" rel="stylesheet">
<style>
:root {
  --accent: #1a6b4a; --accent-light: #e8f5ee; --accent-hover: #15573d;
  --purple: #6366f1; --purple-light: #eef2ff;
  --text: #1a1a2e; --muted: #6b7280; --border: #e2e5ea;
  --card: #ffffff; --input-bg: #f8f9fb; --bg: #f1f3f6;
  --closed-bg: #fef3c7; --closed-border: #f59e0b; --closed-text: #92400e;
  --radius: 10px; --radius-lg: 16px; --radius-xl: 20px;
  --font: 'DM Sans', system-ui, sans-serif;
  --font-display: 'Fraunces', Georgia, serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.5; -webkit-font-smoothing: antialiased; }

.wrap { max-width: 820px; margin: 0 auto; padding: 0 20px 80px; }

/* Sticky section nav */
.sticky-nav { position: sticky; top: 0; z-index: 100; background: var(--card); border-bottom: 1px solid var(--border); padding: 8px 0; }
.sticky-inner { max-width: 820px; margin: 0 auto; padding: 0 20px; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; }
.sticky-inner::-webkit-scrollbar { display: none; }
.sec-pill {
  font-family: var(--font); font-size: 11.5px; font-weight: 600;
  padding: 6px 14px; border-radius: 20px; border: 1.5px solid var(--border);
  background: var(--card); color: var(--muted); cursor: pointer;
  display: inline-block; margin-right: 5px; transition: all 0.15s; white-space: nowrap;
}
.sec-pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }

/* Header */
.page-header { text-align: center; padding: 28px 20px 20px; }
.page-header .tag { font-size: 11.5px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 6px; }
.page-header h1 { font-family: var(--font-display); font-weight: 800; font-size: 28px; color: var(--text); letter-spacing: -0.03em; margin-bottom: 6px; }
.page-header .sub { font-size: 14px; color: var(--muted); max-width: 560px; margin: 0 auto; line-height: 1.5; }

/* Cards */
.card { background: var(--card); border-radius: var(--radius-xl); padding: 32px 28px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); margin-bottom: 20px; }

/* Section headers */
.sh { margin-bottom: 20px; }
.sh:not(:first-child) { margin-top: 36px; }
.sh-row { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
.sh-num { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; flex-shrink: 0; }
.sh-title { font-weight: 700; font-size: 19px; letter-spacing: -0.02em; }
.sh-sub { font-size: 13px; color: var(--muted); margin-left: 46px; line-height: 1.5; }

/* Fields */
.field { margin-bottom: 18px; }
.field-label { font-weight: 600; font-size: 13.5px; display: block; margin-bottom: 4px; }
.field-label .req { color: var(--accent); }
.field-hint { font-size: 12px; color: var(--muted); margin: 0 0 6px; line-height: 1.4; }

input[type="text"], input[type="number"], textarea {
  font-family: var(--font); font-size: 13.5px; padding: 9px 12px;
  border-radius: var(--radius); border: 1.5px solid var(--border);
  background: var(--input-bg); color: var(--text); width: 100%; outline: none; transition: border-color 0.2s;
}
input:focus, textarea:focus { border-color: var(--accent); }
textarea { resize: vertical; min-height: 50px; }
.prefix-wrap { position: relative; }
.prefix-wrap .prefix { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 13px; color: var(--muted); }
.prefix-wrap input { padding-left: 24px; }

/* Pills */
.pill-group { display: flex; flex-wrap: wrap; gap: 5px; }
.pill {
  font-family: var(--font); font-size: 12px; font-weight: 400;
  padding: 5px 12px; border-radius: 16px;
  border: 1.5px solid var(--border); background: var(--input-bg);
  color: var(--text); cursor: pointer; transition: all 0.15s; user-select: none;
}
.pill.selected { font-weight: 600; border: 2px solid var(--accent); background: var(--accent-light); color: var(--accent); }

/* 4-column location grid */
.loc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 6px; }
.loc-cell {}
.loc-cell .loc-label { font-size: 10.5px; font-weight: 700; color: var(--accent); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.loc-cell .pill-group { gap: 3px; }
.loc-cell .pill { font-size: 10.5px; padding: 4px 8px; }

/* Age grid (compact) */
.age-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
.age-table th { font-size: 10px; font-weight: 700; color: var(--accent); text-align: center; padding: 4px 2px; }
.age-table th:first-child { text-align: left; width: 110px; }
.age-table td { padding: 3px 2px; }
.age-table td:first-child { font-size: 11.5px; font-weight: 500; }
.age-table input { font-size: 12px; padding: 6px 4px; text-align: center; width: 100%; }
.age-sub { display: flex; gap: 2px; }
.age-sub input { flex: 1; min-width: 0; }

/* Funding compact cards */
.fund-card { border: 1.5px solid var(--border); border-radius: var(--radius-lg); padding: 18px 18px 12px; margin-bottom: 14px; background: var(--card); }
.fund-card.closed { border-color: var(--closed-border); background: #fffef5; }
.fund-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.fund-name { font-weight: 700; font-size: 14px; line-height: 1.3; }
.fund-badge { font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 3px 8px; border-radius: 10px; white-space: nowrap; }
.fund-badge.active { background: var(--accent-light); color: var(--accent); }
.fund-badge.closed { background: var(--closed-bg); color: var(--closed-text); }
.fund-desc { font-size: 12px; color: var(--muted); line-height: 1.4; margin-bottom: 10px; }
.fund-link { font-size: 11px; color: var(--accent); text-decoration: none; display: inline-block; margin-bottom: 6px; }
.fund-link:hover { text-decoration: underline; }
.fund-q { margin-bottom: 12px; }
.fund-q label { font-weight: 600; font-size: 12.5px; display: block; margin-bottom: 4px; }

/* Banner */
.banner { border-radius: 14px; padding: 14px 18px; margin-bottom: 20px; border: 1.5px solid rgba(26,107,74,0.13); background: var(--accent-light); }
.banner p { font-size: 13px; color: var(--accent); font-weight: 600; line-height: 1.5; }

/* Nav row */
.nav-row { display: flex; justify-content: center; margin-top: 32px; }
.btn { font-family: var(--font); font-size: 15px; font-weight: 700; padding: 14px 40px; border-radius: 14px; cursor: pointer; border: none; transition: all 0.15s; }
.btn-submit { background: var(--accent); color: #fff; box-shadow: 0 2px 8px rgba(26,107,74,0.25); }
.btn-submit:hover { background: var(--accent-hover); }
.btn-submit:disabled { background: #9ca3af; box-shadow: none; cursor: not-allowed; }

/* Done */
.done-wrap { max-width: 600px; margin: 80px auto; text-align: center; padding: 0 20px; }
.done-wrap h1 { font-family: var(--font-display); font-weight: 800; font-size: 32px; color: var(--accent); margin-bottom: 12px; }
.done-wrap .sub { color: var(--muted); font-size: 15px; margin-bottom: 20px; line-height: 1.6; }

.save-toast { position: fixed; bottom: 20px; right: 20px; z-index: 999; background: var(--accent); color: #fff; padding: 8px 16px; border-radius: 10px; font-size: 12px; font-weight: 600; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
.save-toast.show { opacity: 1; }

@media (max-width: 700px) {
  .loc-grid { grid-template-columns: 1fr 1fr; }
  .age-table th, .age-table td { font-size: 10px; }
  .age-sub input { font-size: 11px; padding: 5px 2px; }
  .card { padding: 22px 16px; }
  .page-header h1 { font-size: 22px; }
}
@media (max-width: 440px) {
  .loc-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div id="app"></div>
<div class="save-toast" id="save-toast">Progress saved</div>
<script>
const SUBMIT_URL = "./submit.php";
const STORAGE_KEY = "acpc_arpit_survey_v5";
const N = 4;

const SECTIONS = [
  {id:"basics",label:"Locations"},
  {id:"capacity",label:"Capacity"},
  {id:"schedule",label:"Schedule"},
  {id:"revenue",label:"Revenue"},
  {id:"expenses",label:"Expenses"},
  {id:"staff",label:"Staff"},
  {id:"funding",label:"Funding"},
  {id:"leakage",label:"Leakage"},
  {id:"facility",label:"Facility"},
  {id:"business",label:"Business"},
  {id:"compliance",label:"Compliance"},
];

function a4(v){return [v||"",v||"",v||"",v||""];}

function defaults(){
  return {
    loc: Array.from({length:N},()=>({
      name:"",address:"",legalEntity:"",entityType:"",profitStatus:"",
      licensedCapacity:"",currentEnrollment:"",childrenSpecialNeeds:"",
      ageInfantsFT:"",ageInfantsPT:"",ageToddlersFT:"",ageToddlersPT:"",
      agePreschoolFT:"",agePreschoolPT:"",ageKinderFT:"",ageKinderPT:"",
      ageSchoolAgeFT:"",ageSchoolAgePT:"",
      waitlistSize:"",occupancyRate:"",
      operatingHours:"",extendedHours:"",daysPerWeek:"",weeksPerYear:"",
      parentFees:"",affordabilityGrant:"",wageTopUp:"",otherGovFunding:"",
      otherRevenue:"",otherRevenueDesc:"",
      rent:"",payroll:"",otherExpenses:"",ownerSalary:"",
      totalECEs:"",eceL1:"",eceL2:"",eceL3:"",
      uncertified:"",turnover:"",vacancies:"",
    })),
    fund: {
      affordability: {signed:a4(),amount:a4(),claiming:a4()},
      workforce: {signed:a4(),wageTopup:a4(),pd:a4(),releaseTime:"",employerContrib:""},
      subsidy: {serves:a4(),families:a4(),amount:a4(),extended:a4()},
      icc: {participating:a4(),childrenNeeds:a4()},
      inclusiveSpaces: {applied:a4(),amount:a4()},
      buildingBlocks: {applied:a4(),amount:a4()},
      spaceCreation: {received:a4(),amount:a4()},
      bursary: {applied:"",count:""},
      suppFees: {charging:a4(),types:[],monthlyRev:a4(),reported:""},
    },
    diag: {
      vacancyDays:a4(),childTurnover:a4(),outstandingBal:a4(),
      siblingDisc:"",siblingDetail:"",staffDisc:"",staffDetail:"",ftPtMismatch:"",
      mealProvider:a4(),foodCost:a4(),absorbSupplies:"",supplyCost:"",
      ownLease:a4(),leaseExpiry:a4(),rentIncrease:a4(),maintenance:a4(),
      staffRatio:a4(),adminCount:"",directorCoverage:"",
      wageL1:"",wageL2:"",wageL3:"",wageUncert:"",upgradeEligible:"",
      hasAccountant:"",accountantWho:"",software:"",payMethod:"",
      separateBooks:"",gstReg:"",gstCurrent:"",
      compensation:"",corpStructure:"",sbd:"",personalExp:"",personalDetail:"",holdco:"",
      lastInspection:a4(),violations:a4(),meetingRatios:a4(),complaints:a4(),
      challenge:"",notes:"",
    },
  };
}

function load(){
  try{const s=localStorage.getItem(STORAGE_KEY);if(s){const p=JSON.parse(s);if(p&&p.loc&&p.loc.length===N)return p;}}catch(e){}
  return null;
}
let state = load() || defaults();

let saveTimer;
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
    const t=document.getElementById("save-toast");if(t){t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1200);}}catch(e){}
  },600);
}

function sL(i,k,v){state.loc[i][k]=v;render();save();}
function sF(prog,k,i,v){state.fund[prog][k][i]=v;render();save();}
function sFb(prog,k,v){state.fund[prog][k]=v;render();save();}
function sD(k,v){state.diag[k]=v;render();save();}
function sDL(k,i,v){state.diag[k][i]=v;render();save();}
function toggleSuppFee(v){const a=state.fund.suppFees.types;const i=a.indexOf(v);if(i>=0)a.splice(i,1);else a.push(v);render();save();}

function ln(i){return state.loc[i].name||("Location "+(i+1));}

// DOM
function h(tag,attrs,...ch){
  const el=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{
    if(k==="className")el.className=v;
    else if(k.startsWith("on"))el.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==="html")el.innerHTML=v;
    else el.setAttribute(k,v);
  });
  ch.flat(Infinity).forEach(c=>{if(c!=null)el.appendChild(typeof c==="string"?document.createTextNode(c):c);});
  return el;
}
function inp(type,val,onChange,opts={}){
  const el=h("input",{type,value:val||"",placeholder:opts.ph||"",onInput:e=>onChange(e.target.value)});
  if(opts.prefix)return h("div",{className:"prefix-wrap"},h("span",{className:"prefix"},opts.prefix),el);
  return el;
}
function ta(val,onChange,ph){return h("textarea",{rows:"2",placeholder:ph||"",onInput:e=>onChange(e.target.value)},val||"");}
function pills(val,opts,onChange){
  return h("div",{className:"pill-group"},opts.map(o=>{
    const v=o.v||o,l=o.l||o;
    return h("button",{type:"button",className:"pill"+(val===v?" selected":""),onClick:()=>onChange(v)},l);
  }));
}
function chkPills(arr,opts,onToggle){
  return h("div",{className:"pill-group"},opts.map(o=>{
    const v=o.v||o,l=o.l||o;
    return h("button",{type:"button",className:"pill"+(arr.includes(v)?" selected":""),onClick:()=>onToggle(v)},l);
  }));
}
function sh(n,title,sub){
  return h("div",{className:"sh"},
    h("div",{className:"sh-row"},h("div",{className:"sh-num"},String(n)),h("div",{className:"sh-title"},title)),
    sub?h("p",{className:"sh-sub"},sub):null
  );
}
function fld(label,hint,content,req){
  return h("div",{className:"field"},
    h("label",{className:"field-label",html:label+(req?' <span class="req">*</span>':"" )}),
    hint?h("p",{className:"field-hint"},hint):null, content
  );
}

// Per-location grid helpers
function locGrid(label,hint,fieldKey,type,opts={}){
  const g=h("div",{className:"loc-grid"});
  for(let i=0;i<N;i++){
    const c=h("div",{className:"loc-cell"});
    c.appendChild(h("div",{className:"loc-label"},ln(i)));
    if(type==="number")c.appendChild(inp("number",state.loc[i][fieldKey],v=>sL(i,fieldKey,v),opts));
    else if(type==="text")c.appendChild(inp("text",state.loc[i][fieldKey],v=>sL(i,fieldKey,v),opts));
    else if(type==="pills")c.appendChild(pills(state.loc[i][fieldKey],opts.options,v=>sL(i,fieldKey,v)));
    g.appendChild(c);
  }
  return fld(label,hint,g);
}
function fundGrid(label,hint,prog,key,type,opts={}){
  const g=h("div",{className:"loc-grid"});
  for(let i=0;i<N;i++){
    const c=h("div",{className:"loc-cell"});
    c.appendChild(h("div",{className:"loc-label"},ln(i)));
    if(type==="number")c.appendChild(inp("number",state.fund[prog][key][i],v=>sF(prog,key,i,v),opts));
    else if(type==="pills")c.appendChild(pills(state.fund[prog][key][i],opts.options,v=>sF(prog,key,i,v)));
    g.appendChild(c);
  }
  return fld(label,hint,g);
}
function diagGrid(label,hint,key,type,opts={}){
  const g=h("div",{className:"loc-grid"});
  for(let i=0;i<N;i++){
    const c=h("div",{className:"loc-cell"});
    c.appendChild(h("div",{className:"loc-label"},ln(i)));
    if(type==="number")c.appendChild(inp("number",state.diag[key][i],v=>sDL(key,i,v),opts));
    else if(type==="text")c.appendChild(inp("text",state.diag[key][i],v=>sDL(key,i,v),opts));
    else if(type==="pills")c.appendChild(pills(state.diag[key][i],opts.options,v=>sDL(key,i,v)));
    g.appendChild(c);
  }
  return fld(label,hint,g);
}

// Payload
function num(v){return v===""||v==null?null:Number(v);}
function buildPayload(){
  return {
    submitted_at:new Date().toISOString(), survey_version:"5.0", respondent:"Arpit",
    locations:state.loc.map((l,i)=>({
      location_number:i+1,
      identity:{name:l.name,address:l.address,legal_entity:l.legalEntity,entity_type:l.entityType,profit_status:l.profitStatus},
      capacity:{licensed:num(l.licensedCapacity),enrolled:num(l.currentEnrollment),special_needs:num(l.childrenSpecialNeeds),waitlist:num(l.waitlistSize),occupancy_pct:num(l.occupancyRate),
        age_groups:{infants:{ft:num(l.ageInfantsFT),pt:num(l.ageInfantsPT)},toddlers:{ft:num(l.ageToddlersFT),pt:num(l.ageToddlersPT)},preschool:{ft:num(l.agePreschoolFT),pt:num(l.agePreschoolPT)},kindergarten:{ft:num(l.ageKinderFT),pt:num(l.ageKinderPT)},school_age:{ft:num(l.ageSchoolAgeFT),pt:num(l.ageSchoolAgePT)}}},
      operations:{hours:l.operatingHours,extended_hours:l.extendedHours,days_per_week:num(l.daysPerWeek),weeks_per_year:num(l.weeksPerYear)},
      revenue_monthly:{parent_fees:num(l.parentFees),affordability_grant:num(l.affordabilityGrant),wage_topup:num(l.wageTopUp),other_gov:num(l.otherGovFunding),other:num(l.otherRevenue),other_desc:l.otherRevenueDesc},
      expenses_monthly:{rent:num(l.rent),payroll:num(l.payroll),other:num(l.otherExpenses),owner_salary:l.ownerSalary},
      staff:{total_eces:num(l.totalECEs),level_1:num(l.eceL1),level_2:num(l.eceL2),level_3:num(l.eceL3),uncertified:num(l.uncertified),turnover_12mo:num(l.turnover),vacancies:num(l.vacancies)},
    })),
    funding:state.fund,
    diagnostics:state.diag,
  };
}

// Submit
let submitted=false, sendStatus="", payload=null;
async function submitSurvey(){
  payload=buildPayload();
  const btn=document.querySelector(".btn-submit");
  if(btn){btn.disabled=true;btn.textContent="Submitting\u2026";}
  try{
    const r=await fetch(SUBMIT_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    const d=await r.json();
    sendStatus=(r.ok&&d.ok)?"ok":"error:"+(d.error||r.status);
  }catch(e){sendStatus="error:"+e.message;}
  submitted=true;
  localStorage.removeItem(STORAGE_KEY);
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

// Render
function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  if(submitted){renderDone(app);return;}

  // Sticky nav
  const nav=h("div",{className:"sticky-nav"},h("div",{className:"sticky-inner"},
    ...SECTIONS.map(s=>h("button",{type:"button",className:"sec-pill",onClick:()=>{
      document.getElementById("sec-"+s.id)?.scrollIntoView({behavior:"smooth",block:"start"});
    }},s.label))
  ));
  app.appendChild(nav);

  // Header
  app.appendChild(h("div",{className:"page-header"},
    h("p",{className:"tag"},"ACPC Daycare Diagnostic"),
    h("h1",null,"Arpit\u2019s Daycare Diagnostic"),
    h("p",{className:"sub"},"One page, all four locations side by side. Fill in what you know \u2014 approximate is fine. Your progress saves automatically."),
  ));

  const wrap=h("div",{className:"wrap"});
  app.appendChild(wrap);

  renderBasics(wrap);
  renderCapacity(wrap);
  renderSchedule(wrap);
  renderRevenue(wrap);
  renderExpenses(wrap);
  renderStaff(wrap);
  renderFunding(wrap);
  renderLeakage(wrap);
  renderFacility(wrap);
  renderBusiness(wrap);
  renderCompliance(wrap);

  wrap.appendChild(h("div",{className:"nav-row"},
    h("button",{type:"button",className:"btn btn-submit",onClick:submitSurvey},"Submit Everything \u2192")
  ));
}

function sec(id){return h("div",{id:"sec-"+id,style:"scroll-margin-top:60px"});}

// ─── 1. BASICS ───
function renderBasics(wrap){
  const anchor=sec("basics"); wrap.appendChild(anchor);
  const card=h("div",{className:"card"}); wrap.appendChild(card);
  card.appendChild(sh(1,"Your Locations","Name, address, and legal structure for each location."));
  card.appendChild(locGrid("Daycare Name",null,"name","text",{ph:"e.g. Sunshine Kids NW"}));
  card.appendChild(locGrid("Full Address",null,"address","text",{ph:"Street, City, AB"}));
  card.appendChild(locGrid("Legal Entity","Corp or sole prop holding the licence","legalEntity","text",{ph:"e.g. 123456 AB Ltd."}));
  card.appendChild(locGrid("Entity Type",null,"entityType","pills",{options:["Corp","Sole Prop","Partnership"]}));
  card.appendChild(locGrid("For-Profit / Non-Profit?",null,"profitStatus","pills",{options:["For-Profit","Non-Profit"]}));
}

// ─── 2. CAPACITY ───
function renderCapacity(wrap){
  const anchor=sec("capacity"); wrap.appendChild(anchor);
  const card=h("div",{className:"card"}); wrap.appendChild(card);
  card.appendChild(sh(2,"Capacity & Enrollment","FT (100+ hrs/mo) vs PT (50-99 hrs/mo) directly changes funding."));
  card.appendChild(locGrid("Licensed Capacity",null,"licensedCapacity","number",{ph:"e.g. 60"}));
  card.appendChild(locGrid("Current Enrollment",null,"currentEnrollment","number",{ph:"e.g. 48"}));
  card.appendChild(locGrid("Children with Special Needs",null,"childrenSpecialNeeds","number",{ph:"0"}));

  // Age breakdown
  const ageDiv=h("div",{className:"field"});
  ageDiv.appendChild(h("label",{className:"field-label"},"Enrollment by Age Group (FT / PT per location)"));
  ageDiv.appendChild(h("p",{className:"field-hint"},"Enter full-time and part-time counts for each age group at each location."));
  const tbl=h("table",{className:"age-table"});
  const thead=h("tr"); thead.appendChild(h("th",null,""));
  for(let i=0;i<N;i++){const th=h("th",{colspan:"2"},ln(i));thead.appendChild(th);}
  tbl.appendChild(thead);
  const thead2=h("tr"); thead2.appendChild(h("th",null,""));
  for(let i=0;i<N;i++){thead2.appendChild(h("th",null,"FT"));thead2.appendChild(h("th",null,"PT"));}
  tbl.appendChild(thead2);

    wrap.appendChild(h("p",{className:"sub"},"Your responses have been sent to Nav. Thank you, Arpit! Nav will be in touch with the analysis."));
  } else {
    wrap.appendChild(h("p",{className:"sub",html:"There was an issue submitting. Please <strong>copy the text below</strong> and send it to Nav."}));
    const json=JSON.stringify(payload,null,2);
    const t=h("textarea",{style:"width:100%;height:250px;font-size:11px;font-family:monospace;margin-top:12px;"}); t.value=json;
    wrap.appendChild(t);
    wrap.appendChild(h("div",{style:"margin-top:10px"},h("button",{type:"button",className:"btn btn-submit",onClick:()=>{navigator.clipboard.writeText(json).then(()=>alert("Copied!"));}},  "Copy JSON")));
  }
  app.appendChild(wrap);
}

render();
</script>
</body>
</html>
