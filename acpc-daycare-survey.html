   CONFIG: Change SUBMIT_URL in the <script> section at bottom.

   ============================================================ */

:root {
  --accent: #1a6b4a;
  --accent-light: #e8f5ee;
  --accent-hover: #15573d;
  --text: #1a1a2e;
  --muted: #6b7280;
  --border: #e2e5ea;
  --card: #ffffff;
  --input-bg: #f8f9fb;
  --bg: #f1f3f6;
  --closed-bg: #fef3c7;
  --closed-border: #f59e0b;
  --closed-text: #92400e;
  --radius: 10px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --font: 'DM Sans', system-ui, sans-serif;
  --font-display: 'Fraunces', Georgia, serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ── Layout ── */
.wrap { max-width: 740px; margin: 0 auto; padding: 0 20px 80px; }

/* ── Sticky nav ── */
.sticky-nav {
  position: sticky; top: 0; z-index: 100;
  background: var(--card); border-bottom: 1px solid var(--border);
  padding: 10px 0;
}
.sticky-inner { max-width: 740px; margin: 0 auto; padding: 0 20px; }

.loc-tabs { display: flex; gap: 8px; margin-bottom: 8px; }
.loc-tab {
  flex: 1; padding: 7px 10px; border-radius: 20px; font-family: var(--font);
  font-size: 12.5px; font-weight: 500; border: 1.5px solid var(--border);
  background: var(--card); color: var(--muted); cursor: pointer;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: all 0.15s;
}
.loc-tab.active {
  font-weight: 700; border-color: var(--accent);
  background: var(--accent); color: #fff;
}

.section-tabs { display: flex; border-radius: var(--radius); overflow: hidden; border: 1.5px solid var(--border); }
.section-tab {
  flex: 1; padding: 9px 0; font-family: var(--font); font-size: 13px;
  font-weight: 700; border: none; cursor: pointer;
  background: var(--input-bg); color: var(--muted); transition: all 0.15s;
}
.section-tab.active { background: var(--accent); color: #fff; }

/* ── Header ── */
.page-header { text-align: center; padding: 28px 20px 16px; }
.page-header .tag {
  font-size: 11.5px; font-weight: 700; color: var(--accent);
  text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 6px;
}
.page-header h1 {
  font-family: var(--font-display); font-weight: 800; font-size: 26px;
  color: var(--text); letter-spacing: -0.03em; margin-bottom: 6px;
}
.page-header .sub {
  font-size: 13.5px; color: var(--muted); max-width: 500px;
  margin: 0 auto; line-height: 1.5;
}

/* ── Card ── */
.card {
  background: var(--card); border-radius: var(--radius-xl);
  padding: 36px 32px; box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}

/* ── Section headers ── */
.sh { margin-bottom: 24px; }
.sh:not(:first-child) { margin-top: 44px; }
.sh-row { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
.sh-num {
  width: 36px; height: 36px; border-radius: 50%; background: var(--accent);
  color: #fff; display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 16px; flex-shrink: 0;
}
.sh-title { font-weight: 700; font-size: 20px; letter-spacing: -0.02em; }
.sh-sub { font-size: 13.5px; color: var(--muted); margin-left: 48px; line-height: 1.5; }

/* ── Fields ── */
.field { margin-bottom: 20px; }
.field-label {
  font-weight: 600; font-size: 14px; display: block; margin-bottom: 5px;
}
.field-label .req { color: var(--accent); }
.field-hint {
  font-size: 12.5px; color: var(--muted); margin: 0 0 6px; line-height: 1.4;
}

input[type="text"], input[type="number"], input[type="email"], textarea {
  font-family: var(--font); font-size: 14px; padding: 10px 14px;
  border-radius: var(--radius); border: 1.5px solid var(--border);
  background: var(--input-bg); color: var(--text);
  width: 100%; outline: none; transition: border-color 0.2s;
}
input:focus, textarea:focus { border-color: var(--accent); }
textarea { resize: vertical; min-height: 60px; }

.prefix-wrap { position: relative; }
.prefix-wrap .prefix {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  font-size: 14px; color: var(--muted);
}
.prefix-wrap input { padding-left: 28px; }

/* ── Radio / Checkbox pills ── */
.pill-group { display: flex; flex-wrap: wrap; gap: 8px; }
.pill {
  font-family: var(--font); font-size: 13.5px; font-weight: 400;
  padding: 8px 16px; border-radius: 20px;
  border: 1.5px solid var(--border); background: var(--input-bg);
  color: var(--text); cursor: pointer; transition: all 0.15s;
  user-select: none;
}
.pill.selected {
  font-weight: 600; border: 2px solid var(--accent);
  background: var(--accent-light); color: var(--accent);
}

/* ── Grids ── */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
.grid-1-2 { display: grid; grid-template-columns: 1fr 2fr; gap: 12px; }

.age-grid {
  display: grid; grid-template-columns: auto 1fr 1fr; gap: 8px 10px;
  align-items: center;
}
.age-grid .col-header {
  font-size: 11px; font-weight: 700; color: var(--accent); text-align: center;
}
.age-grid .row-label { font-size: 12.5px; font-weight: 500; }

/* ── Funding cards ── */
.funding-card {
  border: 1.5px solid var(--border); border-radius: var(--radius-lg);
  padding: 24px 24px 16px; margin-bottom: 20px; background: var(--card);
}
.funding-card.closed {
  border-color: var(--closed-border); background: #fffef5;
}
.fc-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.fc-name { font-weight: 700; font-size: 16px; line-height: 1.3; }
.fc-badge {
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  padding: 4px 10px; border-radius: 12px; white-space: nowrap; flex-shrink: 0;
}
.fc-badge.active { background: var(--accent-light); color: var(--accent); }
.fc-badge.closed { background: var(--closed-bg); color: var(--closed-text); }
.fc-link {
  font-size: 12.5px; color: var(--accent); text-decoration: none;
  display: inline-block; margin-bottom: 4px; word-break: break-all;
}
.fc-link:hover { text-decoration: underline; }
.fc-url-note { font-size: 11.5px; color: var(--muted); font-style: italic; margin: 2px 0 8px; }
.fc-desc { font-size: 13px; color: var(--muted); line-height: 1.5; margin: 8px 0 12px; }
.fc-status-note {
  font-size: 12px; font-weight: 600; line-height: 1.4; margin: 0 0 16px;
  padding: 8px 12px; border-radius: 8px;
}
.fc-status-note.active { color: var(--accent); background: var(--accent-light); }
.fc-status-note.closed { color: var(--closed-text); background: var(--closed-bg); }

.fc-q { margin-bottom: 16px; }
.fc-q label { font-weight: 600; font-size: 13.5px; display: block; margin-bottom: 6px; }

/* ── Funding intro banner ── */
.funding-banner {
  background: var(--accent-light); border-radius: 14px;
  padding: 16px 20px; margin-bottom: 24px;
  border: 1.5px solid rgba(26,107,74,0.13);
}
.funding-banner p {
  font-size: 13.5px; color: var(--accent); font-weight: 600; line-height: 1.6;

/* ── Navigation ── */
.nav-row { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; padding: 0 4px; }
.btn {
  font-family: var(--font); font-size: 14px; font-weight: 600;
  padding: 12px 28px; border-radius: 12px; cursor: pointer; transition: all 0.15s;

.btn-secondary { border: 2px solid var(--border); background: var(--card); color: var(--text); }
.btn-secondary:disabled { color: var(--border); cursor: not-allowed; }
.btn-primary {
  border: none; background: var(--accent); color: #fff; font-weight: 700;
  box-shadow: 0 2px 8px rgba(26,107,74,0.25);

.btn-primary:hover { background: var(--accent-hover); }

/* ── Submitted ── */
.done-wrap { max-width: 720px; margin: 60px auto; text-align: center; padding: 0 20px; }
.done-wrap h1 { font-family: var(--font-display); font-weight: 800; font-size: 32px; color: var(--accent); margin-bottom: 12px; }
.done-wrap .sub { color: var(--muted); font-size: 15px; margin-bottom: 24px; line-height: 1.6; }
.done-wrap textarea {
  height: 400px; font-size: 12px; font-family: 'Courier New', monospace;
  line-height: 1.6; background: #fff;

.done-actions { margin-top: 16px; display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }

/* ── Sending state ── */
.send-status { margin-top: 16px; font-size: 14px; font-weight: 600; }
.send-status.ok { color: var(--accent); }
.send-status.err { color: #dc2626; }

/* ── Responsive ── */
@media (max-width: 600px) {
  .grid-2, .grid-3, .grid-1-2 { grid-template-columns: 1fr; }
  .age-grid { grid-template-columns: auto 1fr 1fr; }
  .card { padding: 24px 18px; }
  .page-header h1 { font-size: 22px; }
  .loc-tab { font-size: 11px; padding: 6px 8px; }
}
</style>

const NUM_LOCATIONS = 4;

// ── State ──
let state = {

};

function loc() { return state.locations[state.currentLoc]; }

function set(field, val) {
  state.locations[state.currentLoc][field] = val;
  render();
}

function setFunding(programId, key, val) {
  const f = state.locations[state.currentLoc].funding;
  if (!f[programId]) f[programId] = {};
  f[programId][key] = val;
  render();
}

function toggleCheckbox(programId, key, val) {
  const f = state.locations[state.currentLoc].funding;
  if (!f[programId]) f[programId] = {};
  const arr = f[programId][key] || [];
  const idx = arr.indexOf(val);
  if (idx >= 0) arr.splice(idx, 1); else arr.push(val);
  f[programId][key] = arr;
  render();
}

// ── Rendering helpers ──
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(([k,v]) => {
    if (k === "className") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === "html") el.innerHTML = v;
    else el.setAttribute(k, v);
  });
  children.flat(Infinity).forEach(c => {
    if (c == null) return;
    el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return el;
}

function pillGroup(value, options, onChange) {
  return h("div", {className:"pill-group"}, options.map(o => {
    const v = o.v || o, l = o.l || o;
    return h("button", {
      type:"button", className: "pill" + (value === v ? " selected" : ""),
      onClick: () => onChange(v)
    }, l);
  }));
}

function checkboxGroup(values, options, programId, key) {
  const arr = values || [];
  return h("div", {className:"pill-group"}, options.map(o => {
    const v = o.v || o, l = o.l || o;
    return h("button", {
      type:"button", className: "pill" + (arr.includes(v) ? " selected" : ""),
      onClick: () => toggleCheckbox(programId, key, v)
    }, l);
  }));
}

function inputEl(type, value, onChange, opts = {}) {
  const inp = h("input", {
    type, value: value || "", placeholder: opts.ph || "",
    onInput: e => onChange(e.target.value),
  });
  if (opts.prefix) {
    return h("div", {className:"prefix-wrap"},
      h("span", {className:"prefix"}, opts.prefix), inp
    );
  }
  return inp;
}

function textareaEl(value, onChange, ph) {
  return h("textarea", {rows:"3", placeholder: ph || "", onInput: e => onChange(e.target.value)}, value || "");
}

function sectionHeader(n, title, sub) {
  return h("div", {className: "sh" + (n === 1 ? "" : "")},
    h("div", {className:"sh-row"},
      h("div", {className:"sh-num"}, String(n)),
      h("div", {className:"sh-title"}, title),
    ),
    sub ? h("p", {className:"sh-sub"}, sub) : null,
  );
}

function field(label, hint, content, req) {
  return h("div", {className:"field"},
    h("label", {className:"field-label", html: label + (req ? ' <span class="req">*</span>' : '')}),
    hint ? h("p", {className:"field-hint"}, hint) : null,
    content,
  );
}

// ── Funding card ──
function fundingCard(p) {
  const d = loc().funding[p.id] || {};
  const closed = p.status === "CLOSED";
  const card = h("div", {className: "funding-card" + (closed ? " closed" : "")});

  // Header
  const header = h("div", {className:"fc-header"},
    h("h3", {className:"fc-name"}, p.name),
    h("span", {className: "fc-badge " + (closed ? "closed" : "active")}, p.status),
  );
  card.appendChild(header);

  // Link
  card.appendChild(h("a", {className:"fc-link", href: p.url, target:"_blank", rel:"noopener"}, "🔗 " + p.url.replace("https://www.","")));
  if (p.urlNote) card.appendChild(h("p", {className:"fc-url-note"}, p.urlNote));

  // Description
  card.appendChild(h("p", {className:"fc-desc"}, p.desc));

  // Status note
  if (p.statusNote) card.appendChild(h("p", {className: "fc-status-note " + (closed?"closed":"active")}, "ⓘ " + p.statusNote));

  // Questions
  p.questions.forEach(q => {
    const qDiv = h("div", {className:"fc-q"});
    qDiv.appendChild(h("label", null, q.label));

    if (q.type === "radio") {
      qDiv.appendChild(pillGroup(d[q.key] || "", q.options, v => setFunding(p.id, q.key, v)));
    } else if (q.type === "number") {
      qDiv.appendChild(inputEl("number", d[q.key], v => setFunding(p.id, q.key, v), {ph: q.ph, prefix: "$"}));
    } else if (q.type === "text") {
      qDiv.appendChild(inputEl("text", d[q.key], v => setFunding(p.id, q.key, v), {ph: q.ph}));
    } else if (q.type === "checkbox") {
      qDiv.appendChild(checkboxGroup(d[q.key], q.options, p.id, q.key));
    }

    card.appendChild(qDiv);
  });

  return card;
}

// ── Build JSON payload ──
function buildPayload() {
  return {
    submitted_at: new Date().toISOString(),
    survey_version: "2.0",
    locations: state.locations.map((l, i) => ({
      location_number: i + 1,
      identity: {
        name: l.name, address: l.address, legal_entity: l.legalEntity,
        entity_type: l.entityType, profit_status: l.profitStatus,
      },
      capacity: {
        licensed: num(l.licensedCapacity), enrolled: num(l.currentEnrollment),
        special_needs: num(l.childrenSpecialNeeds),
        waitlist: num(l.waitlistSize), occupancy_pct: num(l.occupancyRate),
        age_groups: {
          infants: { ft: num(l.ageInfantsFT), pt: num(l.ageInfantsPT) },
          toddlers: { ft: num(l.ageToddlersFT), pt: num(l.ageToddlersPT) },
          preschool: { ft: num(l.agePreschoolFT), pt: num(l.agePreschoolPT) },
          kindergarten: { ft: num(l.ageKinderFT), pt: num(l.ageKinderPT) },
          school_age: { ft: num(l.ageSchoolAgeFT), pt: num(l.ageSchoolAgePT) },
        },
      },
      operations: {
        hours: l.operatingHours, extended_hours: l.extendedHours,
        days_per_week: num(l.daysPerWeek), weeks_per_year: num(l.weeksPerYear),
      },
      revenue_monthly: {
        parent_fees: num(l.parentFees), affordability_grant: num(l.affordabilityGrant),
        wage_topup: num(l.wageTopUp), other_gov: num(l.otherGovFunding),
        other: num(l.otherRevenue), other_desc: l.otherRevenueDesc,
      },
      expenses_monthly: {
        rent: num(l.rent), payroll: num(l.payroll), other: num(l.otherExpenses),
        owner_salary: l.ownerSalary,
      },
      staff: {
        total_eces: num(l.totalECEs),
        level_1: num(l.eceL1), level_2: num(l.eceL2), level_3: num(l.eceL3),
        uncertified: num(l.uncertified),
        turnover_12mo: num(l.turnover), vacancies: num(l.vacancies),
      },
      funding: l.funding,
      notes: { biggest_challenge: l.biggestChallenge, additional: l.notes },
    })),
  };
}

function num(v) { return v === "" || v == null ? null : Number(v); }

// ── Submit ──
async function submitSurvey() {
  const payload = buildPayload();

  if (SUBMIT_URL) {
    state.sendStatus = "sending";
    render();
    try {
      const res = await fetch(SUBMIT_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      if (res.ok) {
        state.sendStatus = "ok";
      } else {
        state.sendStatus = "error:" + res.status;
      }
    } catch (e) {
      state.sendStatus = "error:" + e.message;
    }
  }

  state.submitted = true;
  state.payload = payload;
  render();
  window.scrollTo({top: 0, behavior: "smooth"});
}

// ── Render ──
function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";

  if (state.submitted) {
    renderDone(app);
    return;
  }

  const L = loc();
  const cl = state.currentLoc;

  // Sticky nav
  const nav = h("div", {className:"sticky-nav"},
    h("div", {className:"sticky-inner"},
      h("div", {className:"loc-tabs"},
        ...Array.from({length: NUM_LOCATIONS}, (_, i) =>
          h("button", {
            type:"button",
            className: "loc-tab" + (cl === i ? " active" : ""),
            onClick: () => { state.currentLoc = i; render(); document.getElementById("top-anchor")?.scrollIntoView({behavior:"smooth"}); },
          }, state.locations[i].name ? state.locations[i].name.substring(0,12) : `Loc ${i+1}`)
        )
      ),
      h("div", {className:"section-tabs"},
        h("button", {type:"button", className:"section-tab" + (state.tab==="ops"?" active":""), onClick:()=>{state.tab="ops";render();}}, "Operations & Financials"),
        h("button", {type:"button", className:"section-tab" + (state.tab==="funding"?" active":""), onClick:()=>{state.tab="funding";render();}}, "Funding Programs (9)"),
      ),
    )
  );
  app.appendChild(nav);

  // Top anchor
  app.appendChild(h("div", {id:"top-anchor"}));

  // Header
  app.appendChild(h("div", {className:"page-header"},
    h("p", {className:"tag"}, "ACPC Daycare Diagnostic"),
    h("h1", null, L.name || `Location ${cl + 1}`),
    h("p", {className:"sub"}, state.tab === "ops"
      ? "Operations, enrollment, revenue, expenses, staffing."
      : "Every Alberta funding program — verified links. Check what you're getting and what you're missing."
    ),
  ));

  const wrap = h("div", {className:"wrap"});
  app.appendChild(wrap);

  if (state.tab === "ops") renderOps(wrap, L);
  else renderFunding(wrap, L);

  // Nav buttons
  const navRow = h("div", {className:"nav-row"});
  const prevBtn = h("button", {type:"button", className:"btn btn-secondary", disabled: cl===0, onClick:()=>{
    if(cl>0){state.currentLoc=cl-1;render();document.getElementById("top-anchor")?.scrollIntoView({behavior:"smooth"});}
  }}, "← Previous");
  navRow.appendChild(prevBtn);

  if (cl === NUM_LOCATIONS - 1) {
    navRow.appendChild(h("button", {type:"button", className:"btn btn-primary", onClick: submitSurvey}, "Submit All 4 →"));
  } else {
    navRow.appendChild(h("button", {type:"button", className:"btn btn-primary", onClick:()=>{
      state.currentLoc=cl+1;render();document.getElementById("top-anchor")?.scrollIntoView({behavior:"smooth"});
    }}, "Next Location →"));
  }
  wrap.appendChild(navRow);
}

function renderOps(wrap, L) {
  const card = h("div", {className:"card"});
  wrap.appendChild(card);

  // 1 — Identity
  card.appendChild(sectionHeader(1, "Location Identity"));
  card.appendChild(field("Daycare Name", null, inputEl("text", L.name, v=>set("name",v), {ph:"e.g. Sunshine Kids NW"}), true));
  card.appendChild(field("Full Address", null, inputEl("text", L.address, v=>set("address",v), {ph:"Street, Calgary, AB T2X..."})));
  card.appendChild(field("Legal Entity", "Corporation or sole prop holding the licence", inputEl("text", L.legalEntity, v=>set("legalEntity",v), {ph:"e.g. 1234567 Alberta Ltd."})));
  card.appendChild(field("Entity Type", null, pillGroup(L.entityType, ["Corporation","Sole Prop","Partnership"], v=>set("entityType",v))));
  card.appendChild(field("For-Profit / Non-Profit?", null, pillGroup(L.profitStatus, ["For-Profit","Non-Profit"], v=>set("profitStatus",v)), true));

  card.appendChild(sectionHeader(2, "Capacity & Enrollment", "FT (100+ hrs/mo) vs PT (50-99 hrs/mo) directly changes funding."));

  capGrid.appendChild(field("Licensed Capacity", null, inputEl("number", L.licensedCapacity, v=>set("licensedCapacity",v)), true));
  capGrid.appendChild(field("Current Enrollment", null, inputEl("number", L.currentEnrollment, v=>set("currentEnrollment",v)), true));
  capGrid.appendChild(field("Special Needs", null, inputEl("number", L.childrenSpecialNeeds, v=>set("childrenSpecialNeeds",v))));

  ageWrap.appendChild(h("label", {className:"field-label"}, "Enrollment by Age (FT / PT)"));
  const ag = h("div", {className:"age-grid"});
  ag.appendChild(h("span"));
  ag.appendChild(h("span", {className:"col-header"}, "Full-Time"));
  ag.appendChild(h("span", {className:"col-header"}, "Part-Time"));
  [["Infants (0-18mo)","ageInfantsFT","ageInfantsPT"],["Toddlers (19mo-3yr)","ageToddlersFT","ageToddlersPT"],["Preschool (3-4yr)","agePreschoolFT","agePreschoolPT"],["Kindergarten","ageKinderFT","ageKinderPT"],["School-Age (Gr 1-6)","ageSchoolAgeFT","ageSchoolAgePT"]].forEach(([lbl,fk,pk])=>{
    ag.appendChild(h("span", {className:"row-label"}, lbl));
    ag.appendChild(inputEl("number", L[fk], v=>set(fk,v), {ph:"0"}));
    ag.appendChild(inputEl("number", L[pk], v=>set(pk,v), {ph:"0"}));
  });
  ageWrap.appendChild(ag);
  card.appendChild(ageWrap);

  const wg = h("div", {className:"grid-2"});
  wg.appendChild(field("Waitlist", null, inputEl("number", L.waitlistSize, v=>set("waitlistSize",v))));
  wg.appendChild(field("Occupancy %", null, inputEl("number", L.occupancyRate, v=>set("occupancyRate",v), {ph:"e.g. 85"})));
  card.appendChild(wg);

  // 3 — Operations
  card.appendChild(sectionHeader(3, "Operating Schedule", "Extended hours and weekends unlock additional revenue."));
  card.appendChild(field("Regular Hours", null, inputEl("text", L.operatingHours, v=>set("operatingHours",v), {ph:"7:00 AM – 6:00 PM"})));
  card.appendChild(field("Extended hours?", "Before 6 AM, after 6 PM, or weekends.", pillGroup(L.extendedHours, ["Yes","No","Considering"], v=>set("extendedHours",v))));
  const og = h("div", {className:"grid-2"});
  og.appendChild(field("Days/Week", null, pillGroup(L.daysPerWeek, ["5","6","7"], v=>set("daysPerWeek",v))));
  og.appendChild(field("Weeks/Year", null, inputEl("number", L.weeksPerYear, v=>set("weeksPerYear",v), {ph:"50"})));
  card.appendChild(og);

  // 4 — Revenue
  card.appendChild(sectionHeader(4, "Monthly Revenue", "Approximate is fine."));
  const rg1 = h("div", {className:"grid-2"});
  rg1.appendChild(field("Parent Fees", null, inputEl("number", L.parentFees, v=>set("parentFees",v), {prefix:"$"}), true));
  rg1.appendChild(field("Affordability Grant", null, inputEl("number", L.affordabilityGrant, v=>set("affordabilityGrant",v), {prefix:"$"})));
  card.appendChild(rg1);
  const rg2 = h("div", {className:"grid-2"});
  rg2.appendChild(field("Wage Top-Up", null, inputEl("number", L.wageTopUp, v=>set("wageTopUp",v), {prefix:"$"})));
  rg2.appendChild(field("Other Gov Funding", null, inputEl("number", L.otherGovFunding, v=>set("otherGovFunding",v), {prefix:"$"})));
  card.appendChild(rg2);
  const rg3 = h("div", {className:"grid-1-2"});
  rg3.appendChild(inputEl("number", L.otherRevenue, v=>set("otherRevenue",v), {prefix:"$", ph:"Amt"}));
  rg3.appendChild(inputEl("text", L.otherRevenueDesc, v=>set("otherRevenueDesc",v), {ph:"Describe other revenue"}));

  // 5 — Expenses
  card.appendChild(sectionHeader(5, "Monthly Expenses"));

  eg.appendChild(field("All Other", null, inputEl("number", L.otherExpenses, v=>set("otherExpenses",v), {prefix:"$"})));
  card.appendChild(eg);

  // 6 — Staff
  card.appendChild(sectionHeader(6, "Staff & Certification", "ECE levels set wage top-up: L1=$2.64, L2=$5.05, L3=$8.62 per hour."));
  card.appendChild(field("Total ECEs", null, inputEl("number", L.totalECEs, v=>set("totalECEs",v))));

  sg1.appendChild(field("Level 1", null, inputEl("number", L.eceL1, v=>set("eceL1",v), {ph:"0"})));
  sg1.appendChild(field("Level 2", null, inputEl("number", L.eceL2, v=>set("eceL2",v), {ph:"0"})));

  card.appendChild(sg2);

  // 7 — Notes
  card.appendChild(sectionHeader(7, "Challenges & Notes"));

}

function renderFunding(wrap, L) {
  const banner = h("div", {className:"funding-banner"},
    h("p", {html: 'Every program below links directly to <strong>alberta.ca</strong>. Each link verified. 🟢 ACTIVE = accepting. 🟡 CLOSED = still need to know if you received anything. "Not aware" answers are exactly why we\'re doing this.'}),
  );
  wrap.appendChild(banner);
  FUNDING_PROGRAMS.forEach(p => wrap.appendChild(fundingCard(p)));
}

function renderDone(app) {
  const payload = state.payload;
  const json = JSON.stringify(payload, null, 2);

  const wrap = h("div", {className:"done-wrap"});
  wrap.appendChild(h("div", {html: '<div style="font-size:56px;margin-bottom:16px">✅</div>'}));
  wrap.appendChild(h("h1", null, "Survey Complete"));

  if (state.sendStatus === "ok") {
    wrap.appendChild(h("p", {className:"sub"}, "Responses submitted successfully. You can also copy the JSON below."));
  } else if (state.sendStatus.startsWith("error")) {
    wrap.appendChild(h("p", {className:"sub"}, "Submission failed (" + state.sendStatus + "). Copy the JSON below and send it manually."));
  } else if (!SUBMIT_URL) {
    wrap.appendChild(h("p", {className:"sub"}, "No backend configured. Copy the JSON below and send it to Nav."));
  }

  const ta = h("textarea", {readonly:"true"});
  ta.value = json;
  wrap.appendChild(ta);

  const actions = h("div", {className:"done-actions"});
  actions.appendChild(h("button", {type:"button", className:"btn btn-primary", onClick:()=>{
    navigator.clipboard.writeText(json).then(()=>alert("Copied!"));
  }}, "Copy JSON"));
  actions.appendChild(h("button", {type:"button", className:"btn btn-secondary", onClick:()=>{
    const blob = new Blob([json], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = "daycare-survey-" + new Date().toISOString().slice(0,10) + ".json"; a.click();
    URL.revokeObjectURL(url);
  }}, "Download .json"));
  actions.appendChild(h("button", {type:"button", className:"btn btn-secondary", onClick:()=>{
    state.submitted = false; state.currentLoc = 0; render();
  }}, "Edit Responses"));
  wrap.appendChild(actions);

  app.appendChild(wrap);
}

// ── Init ──
render();
</script>
</body>
